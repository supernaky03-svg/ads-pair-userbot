services:
  - type: web
    name: ads-pair-userbot-v2-sg-test
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TELETHON_SESSION_STRING
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: LEGACY_OWNER_TELEGRAM_ID
        sync: false
      - key: TIMEZONE
        value: Asia/Yangon
      - key: DAILY_RUN_TIME
        value: "09:00"
      - key: CUTOFF_TIME
        value: "23:00"
      - key: RETRY_INTERVAL_MINUTES
        value: "60"
      - key: SCHEDULER_POLL_SECONDS
        value: "120"
      - key: REPORT_CHECK_INTERVAL_SECONDS
        value: "300"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "86400"
